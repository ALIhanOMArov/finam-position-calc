<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор позиций</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #888; --card: #1c1c1c; --accent: #3a7afe; --red: #ff6b6b; --green: #4cd964; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 16px; }
  button.link { background: none; color: var(--muted); font-size: 14px; }
  button:disabled { opacity: 0.4; }
  .dirs { display: flex; gap: 8px; margin: 12px 0; }
  .dirs button { background: #2a2a2a; }
  .dirs button.on { background: var(--accent); }
  .big { font-size: 22px; font-weight: bold; text-align: center; margin: 12px 0; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #333; border-radius: 8px; background: #000; color: var(--fg); font-size: 16px; }
  input:disabled { opacity: 0.4; }
  label { display: block; color: var(--muted); font-size: 14px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .error { color: var(--red); }
  .neg { color: var(--red); }
  .pos { color: var(--green); }
  .strategy { padding: 8px 0; border-top: 1px solid #2a2a2a; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 0; vertical-align: top; }
  td:last-child { text-align: right; font-weight: bold; }
</style>
</head>
<body>
<div id="token-form" class="card" hidden>
  <div class="muted">Секретный токен Finam Trade API. Хранится только на этом устройстве.</div>
  <input id="token-input" type="password" autocomplete="off">
  <button id="token-save">Сохранить</button>
</div>

<div id="main" hidden>
  <button id="refresh">Обновить</button>
  <div id="status" class="muted"></div>
  <div id="account"></div>
  <div class="card">
    <div class="muted">Стратегии</div>
    <div id="strategies"></div>
    <button id="strategy-add" class="link">+ Добавить стратегию</button>
  </div>
  <button id="token-reset" class="link">Сменить токен</button>
</div>

<div id="strategy-form" class="card" hidden>
  <label>Имя: код актива и номер стратегии, как в алерте<input id="s-name" placeholder="NG3" autocomplete="off"></label>
  <label>Доля капитала, %<input id="s-pct" type="number" min="0" max="100" step="any"></label>
  <label>Макс. контрактов (необязательно)<input id="s-max" type="number" min="1" step="1"></label>
  <label>Направление
    <select id="s-dir"><option>LONG</option><option>SHORT</option><option>FLAT</option></select>
  </label>
  <label>Контрактов сейчас<input id="s-qty" type="number" min="0" step="1"></label>
  <div id="s-error" class="error"></div>
  <button id="s-save">Сохранить</button>
  <button id="s-delete" class="link">Удалить стратегию</button>
  <button id="s-cancel" class="link">Отмена</button>
</div>

<div id="trade" class="card" hidden>
  <div id="t-title" class="row"></div>
  <div id="t-dirs" class="dirs">
    <button data-dir="LONG">LONG</button><button data-dir="SHORT">SHORT</button><button data-dir="FLAT">FLAT</button>
  </div>
  <div id="t-calc"></div>
  <div id="t-error" class="error"></div>
  <button id="t-done">Исполнено</button>
  <button id="t-cancel" class="link">Отмена</button>
  <button id="t-edit" class="link">Настройки стратегии</button>
</div>

<script>
const API = "https://api.finam.ru/v1";
const TOKEN_KEY = "finamSecret";
const STRATEGIES_KEY = "strategies";
const SIGN = { LONG: 1, SHORT: -1, FLAT: 0 };
const MONTHS = "FGHJKMNQUVXZ";  // коды месяцев в тикерах фьючерсов Мосбиржи: NGV6 — октябрь 2026
const $ = id => document.getElementById(id);

const tg = window.Telegram?.WebApp;
const inTelegram = Boolean(tg?.initData) && tg.isVersionAtLeast("6.9");

let strategies = [];
let strategiesLoaded = false;  // пока не загрузились — не сохраняем, иначе затрём облако
let editing = null;            // индекс редактируемой стратегии, -1 — новая, null — форма закрыта
let trade = null;              // карточка стратегии: {i, direction, target}, direction и target — после выбора направления
let account = null;            // данные последнего «Обновить»

// Портфель хранится в облаке Telegram; в обычном браузере (отладка) — в localStorage
function storageGet(key) {
  if (!inTelegram) return Promise.resolve(localStorage.getItem(key));
  return new Promise((resolve, reject) =>
    tg.CloudStorage.getItem(key, (err, value) => err ? reject(new Error(err)) : resolve(value || null)));
}

function storageSet(key, value) {
  if (!inTelegram) return Promise.resolve(localStorage.setItem(key, value));
  return new Promise((resolve, reject) =>
    tg.CloudStorage.setItem(key, value, err => err ? reject(new Error(err)) : resolve()));
}

async function api(method, path, { body, jwt } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (jwt) headers.Authorization = jwt;
  const resp = await fetch(API + path, { method, headers, body: body && JSON.stringify(body) });
  const data = await resp.json();
  if (!resp.ok) throw new Error(`${resp.status}: ${data.message || JSON.stringify(data)}`);
  return data;
}

const num = v => Number(v.value);                       // {"value": "1.5"} -> 1.5
const money = m => Number(m.units) + m.nanos / 1e9;     // {"units": "909", "nanos": 530000000} -> 909.53
const fmt = (x, digits = 0) => x.toLocaleString("ru-RU", { maximumFractionDigits: digits });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const signed = q => (q > 0 ? "+" : "") + q;
const assetOf = name => name.match(/^[A-Za-z]+/)[0];   // NG3 → NG

// Фьючерс с ГО; null — не фьючерс
async function loadContract(symbol, accountId, jwt) {
  const q = encodeURIComponent(symbol);
  const [asset, params] = await Promise.all([
    api("GET", `/assets/${q}?account_id=${accountId}`, { jwt }),
    api("GET", `/assets/${q}/params?account_id=${accountId}`, { jwt }),
  ]);
  if (asset.type !== "FUTURES") return null;
  return {
    ticker: asset.ticker,
    expiration: asset.expiration_date,                 // {year, month, day}
    goLong: money(params.long_initial_margin),
    goShort: money(params.short_initial_margin),
  };
}

// Позиции по активу на счёте нет — берём ближайший неистёкший контракт, перебирая месяцы вперёд
async function nearestContract(base, accountId, jwt) {
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const symbol = `${base}${MONTHS[d.getMonth()]}${d.getFullYear() % 10}@RTSX`;
    const c = await loadContract(symbol, accountId, jwt).catch(() => null);  // такого контракта нет
    const e = c?.expiration;
    if (e && new Date(e.year, e.month - 1, e.day + 1) > now) return c;
  }
  return null;
}

async function loadAccount(secret, assets) {
  const { token: jwt } = await api("POST", "/sessions", { body: { secret } });
  const { account_ids } = await api("POST", "/sessions/details", { body: { token: jwt } });
  const acc = await api("GET", `/accounts/${account_ids[0]}`, { jwt });

  const futures = [];
  const contracts = {};  // актив → контракт, от которого берём ГО для расчёта
  for (const p of acc.positions) {
    if (!p.symbol.endsWith("@RTSX")) continue;  // не срочный рынок Мосбиржи
    const c = await loadContract(p.symbol, acc.account_id, jwt);
    if (!c) continue;
    const base = c.ticker.slice(0, -2);  // NGV6 → NG: контракт не показываем, переход делается руками
    const qty = num(p.quantity);
    contracts[base] = c;
    futures.push({ base, qty, go: qty < 0 ? c.goShort : c.goLong });
  }
  for (const base of assets) {
    if (!contracts[base]) contracts[base] = await nearestContract(base, acc.account_id, jwt);
  }
  return { acc, futures, contracts };
}

function render({ acc, futures }) {
  const free = acc.portfolio_mc?.available_cash;
  const rows = futures.map(f => `
    <tr>
      <td>${f.base}<div class="muted">ГО ${fmt(f.go, 2)} ₽</div></td>
      <td class="${f.qty < 0 ? "neg" : "pos"}">${f.qty > 0 ? "+" : ""}${f.qty}</td>
    </tr>`).join("");
  $("account").innerHTML = `
    <div class="card">
      <div class="row"><span>Счёт</span><span>${acc.account_id}</span></div>
      <div class="row"><span>Капитал</span><b>${fmt(num(acc.equity))} ₽</b></div>
      ${free ? `<div class="row"><span>Свободно</span><span>${fmt(num(free))} ₽</span></div>` : ""}
      <div class="row"><span>Нереализ. P&amp;L</span><span>${fmt(num(acc.unrealized_profit))} ₽</span></div>
    </div>
    <div class="card">
      <div class="muted">Фьючерсы на счёте</div>
      <table>${rows || "<tr><td>нет</td></tr>"}</table>
    </div>`;
}

function renderStrategies() {
  $("strategies").innerHTML = strategies.map((s, i) => `
    <div class="strategy" data-i="${i}">
      <div class="row">
        <b>${esc(s.name)}</b>
        <span class="${s.quantity < 0 ? "neg" : s.quantity > 0 ? "pos" : ""}">${s.direction} ${s.quantity > 0 ? "+" : ""}${s.quantity}</span>
      </div>
      <div class="muted">${s.allocationPct}%${s.maxContracts ? ` · макс ${s.maxContracts}` : ""}</div>
    </div>`).join("") || `<div class="muted">Пока нет ни одной</div>`;
}

// Временная формула: доля капитала / ГО контракта, не больше «макс». Логику управления решаем потом — меняем только здесь
function targetQuantity(s, direction, equity, go) {
  if (direction === "FLAT") return 0;
  const qty = Math.floor(equity * s.allocationPct / 100 / go);
  return SIGN[direction] * (s.maxContracts ? Math.min(qty, s.maxContracts) : qty);
}

function renderTrade() {
  const s = strategies[trade.i];
  const base = assetOf(s.name);
  $("t-title").innerHTML = `<b>${esc(s.name)}</b><span>${s.direction} ${signed(s.quantity)}</span>`;
  for (const b of $("t-dirs").children) {
    b.disabled = b.dataset.dir === s.direction;
    b.classList.toggle("on", b.dataset.dir === trade.direction);
  }
  $("t-error").textContent = "";
  trade.target = null;

  const c = account?.contracts[base];
  if (!trade.direction) {
    $("t-calc").innerHTML = "";
  } else if (!account || (!c && trade.direction !== "FLAT")) {
    $("t-calc").innerHTML = `<div class="muted">${account ? `Не нашёл контракт ${esc(base)}, ГО неизвестно.` : ""} Нажми «Обновить»</div>`;
  } else {
    const equity = num(account.acc.equity);
    const go = c && (trade.direction === "SHORT" ? c.goShort : c.goLong);
    trade.target = targetQuantity(s, trade.direction, equity, go);
    const delta = trade.target - s.quantity;
    const onAccount = account.futures.filter(f => f.base === base).reduce((sum, f) => sum + f.qty, 0);
    $("t-calc").innerHTML = `
      ${trade.direction === "FLAT" ? "" : `
        <div class="row"><span>Капитал</span><span>${fmt(equity)} ₽</span></div>
        <div class="row"><span>Бюджет ${s.allocationPct}%${s.maxContracts ? ` · макс ${s.maxContracts}` : ""}</span><span>${fmt(equity * s.allocationPct / 100)} ₽</span></div>
        <div class="row"><span>ГО ${c.ticker}</span><span>${fmt(go, 2)} ₽</span></div>`}
      <div class="row"><span>Цель</span><b>${signed(trade.target)}</b></div>
      <div class="row"><span>Сейчас</span><span>${signed(s.quantity)}</span></div>
      <div class="big ${delta < 0 ? "neg" : delta > 0 ? "pos" : ""}">
        ${delta > 0 ? `КУПИТЬ ${delta} ${esc(base)}` : delta < 0 ? `ПРОДАТЬ ${-delta} ${esc(base)}` : "Ничего делать не нужно"}
      </div>
      <div class="row"><span>На счёте ${esc(base)}</span><span>${signed(onAccount)} → ${signed(onAccount + delta)}</span></div>`;
  }
  $("t-done").hidden = trade.target === null;
}

function openTrade(i) {
  trade = { i, direction: null, target: null };
  renderTrade();
  showScreen();
}

async function refresh() {
  $("status").className = "muted";
  $("status").textContent = "Загрузка…";
  try {
    account = await loadAccount(localStorage.getItem(TOKEN_KEY), new Set(strategies.map(s => assetOf(s.name))));
    render(account);
    $("status").textContent = `Обновлено ${new Date().toLocaleTimeString("ru-RU")}`;
  } catch (e) {
    $("status").className = "error";
    $("status").textContent = `Ошибка: ${e.message}`;
  }
}

function showScreen() {
  const hasToken = Boolean(localStorage.getItem(TOKEN_KEY));
  $("token-form").hidden = hasToken;
  $("main").hidden = !hasToken || editing !== null || trade !== null;
  $("strategy-form").hidden = !hasToken || editing === null;
  $("trade").hidden = !hasToken || trade === null;
}

function openForm(i) {
  editing = i;
  const s = strategies[i] ?? { name: "", allocationPct: "", maxContracts: null, direction: "FLAT", quantity: 0 };
  $("s-name").value = s.name;
  $("s-pct").value = s.allocationPct;
  $("s-max").value = s.maxContracts ?? "";
  $("s-dir").value = s.direction;
  $("s-qty").value = Math.abs(s.quantity);
  $("s-qty").disabled = s.direction === "FLAT";
  $("s-delete").hidden = i < 0;
  $("s-delete").textContent = "Удалить стратегию";
  $("s-error").textContent = "";
  showScreen();
}

function closeForm() {
  editing = null;
  trade = null;
  showScreen();
}

function readForm() {
  const name = $("s-name").value.trim();
  const allocationPct = Number($("s-pct").value);
  const maxContracts = $("s-max").value === "" ? null : Number($("s-max").value);
  const direction = $("s-dir").value;
  const qty = direction === "FLAT" ? 0 : Number($("s-qty").value);
  // актив стратегии — буквы в начале имени (NG3 → NG), контракт не храним: он меняется
  if (!/^[A-Za-z]+\d+$/.test(name)) throw new Error("Имя — код актива и номер стратегии, например NG3");
  if (strategies.some((s, i) => i !== editing && s.name.toLowerCase() === name.toLowerCase())) {
    throw new Error(`Стратегия ${name} уже есть`);
  }
  if (!(allocationPct > 0 && allocationPct <= 100)) throw new Error("Доля — число больше 0 и не больше 100");
  if (maxContracts !== null && !(Number.isInteger(maxContracts) && maxContracts > 0)) {
    throw new Error("Макс. контрактов — целое число больше 0");
  }
  if (!(Number.isInteger(qty) && qty >= 0)) throw new Error("Контрактов — целое число, 0 или больше");
  return { name, allocationPct, maxContracts, direction, quantity: SIGN[direction] * qty };
}

async function saveStrategies(next) {
  if (!strategiesLoaded) throw new Error("Стратегии не загрузились — перезапусти приложение");
  await storageSet(STRATEGIES_KEY, JSON.stringify(next));
  strategies = next;
  renderStrategies();
  closeForm();
}

$("token-save").onclick = () => {
  const secret = $("token-input").value.trim();
  if (!secret) return;
  localStorage.setItem(TOKEN_KEY, secret);
  $("token-input").value = "";
  showScreen();
  refresh();
};
$("token-reset").onclick = () => {
  localStorage.removeItem(TOKEN_KEY);
  account = null;
  $("account").innerHTML = "";
  $("status").textContent = "";
  showScreen();
};
$("refresh").onclick = refresh;

$("strategy-add").onclick = () => openForm(-1);
$("strategies").onclick = e => {
  const row = e.target.closest(".strategy");
  if (row) openTrade(Number(row.dataset.i));
};
$("s-dir").onchange = () => {
  $("s-qty").disabled = $("s-dir").value === "FLAT";
  if ($("s-qty").disabled) $("s-qty").value = 0;
};
$("s-save").onclick = async () => {
  try {
    const s = readForm();
    await saveStrategies(editing < 0 ? [...strategies, s] : strategies.map((old, i) => i === editing ? s : old));
  } catch (e) {
    $("s-error").textContent = e.message;
  }
};
$("s-delete").onclick = async () => {
  if ($("s-delete").textContent !== "Точно удалить?") {
    $("s-delete").textContent = "Точно удалить?";
    return;
  }
  try {
    await saveStrategies(strategies.filter((_, i) => i !== editing));
  } catch (e) {
    $("s-error").textContent = e.message;
  }
};
$("s-cancel").onclick = closeForm;

$("t-dirs").onclick = e => {
  if (!e.target.dataset.dir) return;
  trade.direction = e.target.dataset.dir;
  renderTrade();
};
$("t-done").onclick = async () => {
  const { i, direction, target } = trade;
  try {
    await saveStrategies(strategies.map((old, j) => j === i ? { ...old, direction, quantity: target } : old));
  } catch (e) {
    $("t-error").textContent = e.message;
  }
};
$("t-cancel").onclick = closeForm;
$("t-edit").onclick = () => {
  const { i } = trade;
  trade = null;
  openForm(i);
};

tg?.ready();
tg?.expand();
showScreen();
storageGet(STRATEGIES_KEY)
  .then(value => {
    strategies = JSON.parse(value || "[]");
    strategiesLoaded = true;
    renderStrategies();
  })
  .catch(e => {
    $("status").className = "error";
    $("status").textContent = `Не удалось загрузить стратегии: ${e.message}`;
  });
</script>
</body>
</html>
